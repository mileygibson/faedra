    } else player.jump = 0;

    let dx = (keys.has('ArrowRight') || keys.has('d') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('a') ? 1 : 0) + touch.x;
    let dy = (keys.has('ArrowDown') || keys.has('s') ? 1 : 0) - (keys.has('ArrowUp') || keys.has('w') ? 1 : 0) + touch.y;
    const magnitude = Math.hypot(dx, dy);
    player.moving = magnitude > .08;
    if (magnitude > 1) { dx /= magnitude; dy /= magnitude; }
    if (player.moving) {
      const speed = player.speed * dt;
      const nx = player.x + dx * speed;
      const ny = player.y + dy * speed;
      if (!blocked(nx, player.y)) player.x = nx;
      if (!blocked(player.x, ny)) player.y = ny;
      player.faceX = dx; player.faceY = dy;
    }
    if (scene === 'lake' && inBoat) {
      lakeBoat.x = player.x;
      lakeBoat.y = player.y;
    }
    if (scene === 'forest') {
      for (const light of lights) {
        if (!light.taken && distance(player, light) < 30) {
          light.taken = true;
          player.collected++;
          say(`You found ${light.name}. A warm little light settles in your pocket.`);
          updateHud();
        }
      }
    }
    for (const enemy of enemiesForScene()) {
      if (!enemy.alive) continue;
      enemy.hit = Math.max(0, enemy.hit - dt);
      enemy.phase += dt;
      const targetX = enemy.homeX + Math.sin(enemy.phase * .55) * 30;
      const targetY = enemy.homeY + Math.cos(enemy.phase * .7) * 24;
      enemy.x += (targetX - enemy.x) * dt * .7;
      enemy.y += (targetY - enemy.y) * dt * .7;
      if (distance(player, enemy) < 24 && player.jump < 10) damage();
    }
    if (scene === 'northGrove') {
      for (const relic of northRelics) {
        if (!relic.taken && distance(player, relic) < 32) {
          relic.taken = true;
          say(`You found ${relic.name}. Bring it to the Northstar altar.`);
          updateHud();
        }
      }
    }
    if (scene === 'snowyMountain') {
      for (const relic of mountainRelics) {
        if (!relic.taken && distance(player, relic) < 34) {
          relic.taken = true;
          say(`You found ${relic.name}. Carry it to the mountain summit.`);
          updateHud();
        }
      }
    }
    if (scene === 'meadow') {
      for (const bloom of meadowBlooms) {
        if (!bloom.taken && distance(player, bloom) < 30) {
          bloom.taken = true;
          say(`You gather ${bloom.name}. Carry it to the stone circle.`);
          updateHud();
        }
      }
    }
    if (scene === 'lake' && !inBoat) {
      for (const item of lakeItems) {
        if (!item.taken && distance(player, item) < 32) {
          item.taken = true;
          say(`You found ${item.name}. Bring it to Moonstone Isle.`);
          updateHud();
        }
      }
    }
    const ruinsRelic = activeRuinsRelic(scene);
    if (ruinsRelic && (scene !== 'lake' || !inBoat) && distance(player, ruinsRelic) < 34) {
      ruinsRelic.taken = true;
      say(`You found ${ruinsRelic.name}. Return it to the offering stone at the ancient ruins.`);
      updateHud();
    }
    const target = interactable();
    if (target) {
      const hints = {
        sign: 'E  Read the sign',
        shrine: player.collected === 3 ? 'E  Enter the ancient shrine' : 'The old shrine is waiting for three lights',
        mountainSummitEntrance: 'E  Explore the mountain summit',
        ruinsGuide: `E  Talk to ${ruinsGuide.name}`,
        mountainSummitAltar: mountainRelicsDelivered ? 'The summit altar shines with five froststones' : mountainRelics.every(relic => relic.taken) ? 'E  Place the froststones on the altar' : 'The summit altar is waiting for five froststones',
        mountainInscription: 'E  Read the stone inscription',
        mountainSummitExit: 'E  Return to the mountain peak',
        mountainExit: 'E  Return to Northstar Glade',
        ruinsEntrance: 'E  Follow the western path to the ancient ruins',
        ruinsOffering: ruinsProgress >= ruinsRelics.length ? 'The five seals are returned' : ruinsRelics[ruinsProgress].taken ? `E  Return ${ruinsRelics[ruinsProgress].name}` : `The offering stone awaits ${ruinsRelics[ruinsProgress].name}`,
        ruinsDoor: ruinsProgress >= ruinsRelics.length ? 'E  Enter the ancient ruins' : 'Return all five seals to open the ancient door',
        ruinsExit: 'E  Return to the forest',
        ruinsInteriorExit: 'E  Leave the ruins and keep exploring',
        ruinsInscription: 'E  Read the stone inscription',
        ruinsCenterpiece: 'E  Awaken the heart of the ruins',
        northGate: lakeItemsDelivered ? 'E  Enter the Northstar Glade' : 'Return all four lake keepsakes to the Moonstone to open the Northstar path',
        northAltar: 'E  Explore the Northstar altar',
        northShrineAltar: northRelicsDelivered ? 'The Northstar altar glows with four shards' : northRelics.every(relic => relic.taken) ? 'E  Place the shards on the altar' : 'The altar is waiting for four aurora shards',
        northShrineInscription: 'E  Read the stone inscription',
        northShrineExit: 'E  Return to the glade',
        northExit: 'E  Return to the forest',
        northMountainGuide: `E  Talk to ${northMountainGuide.name}`,
        northMountainEntrance: northRelicsDelivered ? 'E  Enter the snowy mountain' : 'Return all four aurora shards to the Northstar altar to open the mountain pass',
        meadowGate: player.collected < 3 ? 'Find all three lost lights to open the meadow gate' : 'E  Follow the eastern lane to the meadow',
        meadowExit: 'E  Return to the village',
        meadowPerson: `E  Talk to ${meadowGuide.name}`,
        meadowGatheringPlace: 'E  Explore the stone circle',
        lakeEntrance: meadowBlooms.every(bloom => bloom.taken) ? 'E  Follow the stream to the South Lake' : 'Gather all three blooms to open the lake path',
        lakeBoat: 'E  Board the boat',
        lakeDock: 'E  Dock at the shore',
        moonstoneEntrance: 'E  Enter Moonstone Isle',
        moonstoneAltar: lakeItemsDelivered ? 'The Moonstone glimmers with keepsakes' : lakeItems.every(item => item.taken) ? 'E  Place the keepsakes on the Moonstone' : 'The Moonstone is waiting for four keepsakes',
        moonstoneExit: 'E  Return to the Moonstone Isle docks',
        circleAltar: meadowDelivered ? 'The heartstone shines with flowers' : meadowBlooms.every(bloom => bloom.taken) ? 'E  Place the blooms at the heartstone' : 'The heartstone is waiting for three blooms',
        circleInscription: 'E  Read the stone carving',
        circleExit: 'E  Return to the meadow',
        lakeGuide: `E  Talk to ${lakeGuide.name}`,
        moonstoneGuide: `E  Talk to ${moonstoneGuide.name}`,
        lakeExit: 'E  Follow the stream back to the meadow',
        altar: shrineAwakened ? 'E  Listen to the heartwood' : 'E  Set the lights into the altar',
        inscription: 'E  Read the inscription',
        exit: 'E  Return to the forest'
      };
      hint.textContent = target.type === 'person' || target.type === 'resident' ? `E  Talk to ${target.item.name}` : target.type === 'buildingDoor' ? `E  Enter ${target.item.name}` : target.type === 'interiorProp' ? `E  Inspect ${target.item.name}` : hints[target.type];
      hint.classList.add('visible');
    } else hint.classList.remove('visible');

    const activeWorld = scene === 'ruinsInterior' ? ruinsInteriorWorld : scene === 'ruins' ? ruinsWorld : scene === 'mountainSummit' ? mountainSummitWorld : scene === 'snowyMountain' ? mountainWorld : scene === 'northShrine' ? northShrineWorld : scene === 'northGrove' ? northWorld : scene === 'moonstoneIsle' ? moonstoneWorld : scene === 'lake' ? lakeWorld : scene === 'stoneCircle' ? stoneCircleWorld : scene === 'meadow' ? meadowWorld : scene === 'shrine' ? shrineWorld : scene === 'building' ? buildingWorld : world;
    const viewW = width, viewH = height;
    camera.x = activeWorld.width < viewW ? (activeWorld.width - viewW) / 2 : Math.max(0, Math.min(activeWorld.width - viewW, player.x - viewW / 2));
    camera.y = activeWorld.height < viewH ? (activeWorld.height - viewH) / 2 : Math.max(0, Math.min(activeWorld.height - viewH, player.y - viewH / 2));
  }
  function render() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, width, height);
    ctx.save();
    ctx.translate(-camera.x, -camera.y);
    if (scene === 'ruinsInterior') {
      drawRuinsInterior();
      drawPlayer();
    } else if (scene === 'ruins') {
      drawAncientRuins();
      drawPlayer();
    } else if (scene === 'mountainSummit') {
      drawMountainSummitInterior();
      drawPlayer();
    } else if (scene === 'snowyMountain') {
      drawSnowyMountain();
      const actors = mountainRelics.filter(relic => !relic.taken).map(relic => ({ y: relic.y, draw: () => drawNorthRelic(relic) }));
      const ruinsRelic = activeRuinsRelic('snowyMountain');
      if (ruinsRelic) actors.push({ y: ruinsRelic.y, draw: () => drawNorthRelic(ruinsRelic) });
      if (mountainRelicsDelivered) actors.push({ y: ruinsGuide.y, draw: () => drawForestPerson(ruinsGuide) });
      actors.push({ y: player.y, draw: drawPlayer });
      actors.sort((a, b) => a.y - b.y);
      for (const actor of actors) actor.draw();
    } else if (scene === 'northGrove') {
      drawNorthArea();
      const actors = northEnemies.filter(enemy => enemy.alive).map(enemy => ({ y: enemy.y, draw: () => drawEnemy(enemy) }));
      for (const relic of northRelics) actors.push({ y: relic.y, draw: () => drawNorthRelic(relic) });
      const ruinsRelic = activeRuinsRelic('northGrove');
      if (ruinsRelic) actors.push({ y: ruinsRelic.y, draw: () => drawNorthRelic(ruinsRelic) });
      if (northRelicsDelivered) actors.push({ y: northMountainGuide.y, draw: () => drawForestPerson(northMountainGuide) });
      actors.push({ y: player.y, draw: drawPlayer });
      actors.sort((a, b) => a.y - b.y);
      for (const actor of actors) actor.draw();
    } else if (scene === 'northShrine') {
      drawNorthShrineInterior();
      drawPlayer();
    } else if (scene === 'lake') {
      drawLakeArea();
      for (const item of lakeItems) drawLakeItem(item);
      const ruinsRelic = activeRuinsRelic('lake');
      if (ruinsRelic) drawNorthRelic(ruinsRelic);
      const boatX = inBoat ? player.x : lakeBoat.x;
      const boatY = inBoat ? player.y : lakeBoat.y;
      const boatAngle = inBoat ? Math.atan2(player.faceY, player.faceX) : 0;
      drawLakeBoat(boatX, boatY, boatAngle);
      if (lakeItemsDelivered) drawForestPerson(moonstoneGuide);
      drawPlayer();
    } else if (scene === 'moonstoneIsle') {
      drawMoonstoneInterior();
      drawPlayer();
    } else if (scene === 'stoneCircle') {
      drawStoneCircleInterior();
      drawPlayer();
    } else if (scene === 'building') {
      drawBuildingInterior();
      drawForestPerson(buildingInteriors[currentBuilding.kind].resident);
      drawPlayer();
    } else if (scene === 'meadow') {
      drawMeadowGround();
      for (const bloom of meadowBlooms) drawMeadowBloom(bloom);
      const actors = meadowEnemies.filter(enemy => enemy.alive).map(enemy => ({ y: enemy.y, draw: () => drawEnemy(enemy) }));
      const ruinsRelic = activeRuinsRelic('meadow');
      if (ruinsRelic) actors.push({ y: ruinsRelic.y, draw: () => drawNorthRelic(ruinsRelic) });
      actors.push({ y: meadowGuide.y, draw: () => drawForestPerson(meadowGuide) });
      if (meadowDelivered) actors.push({ y: lakeGuide.y, draw: () => drawForestPerson(lakeGuide) });
      actors.push({ y: player.y, draw: drawPlayer });
      actors.sort((a, b) => a.y - b.y);
      for (const actor of actors) actor.draw();
    } else if (scene === 'shrine') {
      drawShrineInterior();
      drawPlayer();
    } else {
      drawGround();
      for (const stone of stones) drawStone(stone);
      for (const sign of signposts) drawSign(sign);
      for (const light of lights) drawLight(light);
      if (mountainRelicsDelivered) drawForestRuinsGate();
      const actors = trees.map(tree => ({ y: tree.y, draw: () => drawTree(tree) }));
      const ruinsRelic = activeRuinsRelic('forest');
      if (ruinsRelic) actors.push({ y: ruinsRelic.y, draw: () => drawNorthRelic(ruinsRelic) });
      if (shrineAwakened) for (const person of forestFolk) actors.push({ y: person.y, draw: () => drawForestPerson(person) });
      for (const person of villageFolk) actors.push({ y: person.y, draw: () => drawForestPerson(person) });
      actors.push({ y: player.y, draw: drawPlayer });
      for (const enemy of enemies) if (enemy.alive) actors.push({ y: enemy.y, draw: () => drawEnemy(enemy) });
      actors.sort((a, b) => a.y - b.y);
      for (const actor of actors) actor.draw();
    }
    ctx.restore();
  }
  function frame(time) {
    const dt = Math.min((time - lastTime) / 1000 || 0, .04);
    lastTime = time;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  function keyDown(event) {
    if (gameWon) {
      event.preventDefault();
      return;
    }
    const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();
    keys.add(key);
    if (!event.repeat) {
      if (key === 'j' || key === 'J') performAttack();
      if (key === 'e' || key === 'E' || key === 'Enter') performInteract();
      if (key === ' ' || key === 'Spacebar') jump();
    }
  }
  function keyUp(event) {
    keys.delete(event.key.length === 1 ? event.key.toLowerCase() : event.key);
  }
  addEventListener('keydown', keyDown);
  addEventListener('keyup', keyUp);
  addEventListener('blur', () => keys.clear());
  endingButton.addEventListener('click', () => {
    gameWon = false;
    ending.classList.remove('visible');
  });
  document.querySelectorAll('[data-dir]').forEach(button => {
    const dir = button.dataset.dir;
    const vectors = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    const start = event => {
      event.preventDefault(); button.setPointerCapture(event.pointerId); button.classList.add('pressed');
      touch.x = vectors[dir][0]; touch.y = vectors[dir][1];
    };
    const stop = event => { if (event) event.preventDefault(); button.classList.remove('pressed'); touch.x = 0; touch.y = 0; };
    button.addEventListener('pointerdown', start);
    button.addEventListener('pointerup', stop);
    button.addEventListener('pointercancel', stop);
    button.addEventListener('lostpointercapture', stop);
  });
  document.querySelectorAll('[data-action]').forEach(button => {
    const action = button.dataset.action;
    const start = event => {
      event.preventDefault(); button.setPointerCapture(event.pointerId); button.classList.add('pressed');
      if (action === 'attack') performAttack();
      else if (action === 'jump') jump();
      else if (action === 'interact') performInteract();
    };
    const stop = () => button.classList.remove('pressed');
    button.addEventListener('pointerdown', start);
    button.addEventListener('pointerup', stop);
    button.addEventListener('pointercancel', stop);
    button.addEventListener('lostpointercapture', stop);
  });
  updateHud();
  say('The forest has gone quiet. Find the three lights and follow the old path.');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
