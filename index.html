<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#182a20">

  <style>

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #182a20; }
    body { font-family: 'DM Sans', sans-serif; color: var(--ink); overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
    #game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

    .brand { position: absolute; top: max(24px, env(safe-area-inset-top)); left: max(26px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 35px; height: 35px; display: grid; place-items: center; border: 1px solid rgba(243, 207, 117, .7); border-radius: 50%; color: var(--gold); font: 18px 'Fraunces', serif; box-shadow: inset 0 0 14px rgba(243, 207, 117, .1); }
    .brand-name { font: 700 16px 'Fraunces', serif; letter-spacing: .03em; }
    .brand-sub { margin-top: 2px; color: var(--muted); font: 9px 'DM Mono', monospace; letter-spacing: .16em; text-transform: uppercase; }
    .quest { position: absolute; top: max(24px, env(safe-area-inset-top)); right: max(26px, env(safe-area-inset-right)); width: min(250px, 42vw); padding: 14px 16px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); backdrop-filter: blur(8px); }
    .quest-label { display: flex; justify-content: space-between; align-items: center; color: var(--gold); font: 10px 'DM Mono', monospace; letter-spacing: .12em; text-transform: uppercase; }
    .seeds { color: var(--ink); letter-spacing: .16em; }
    .quest-text { margin-top: 8px; color: var(--ink); font-size: 13px; font-weight: 600; }
    .health { position: absolute; top: 88px; right: max(26px, env(safe-area-inset-right)); display: flex; gap: 5px; }
    .heart { width: 17px; height: 17px; color: #ee947e; filter: drop-shadow(0 1px 3px rgba(0,0,0,.4)); }
    .heart.empty { color: rgba(237, 242, 215, .28); }
    .hint { position: absolute; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 9px 14px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); color: var(--ink); font-size: 13px; white-space: nowrap; opacity: 0; transition: opacity .16s ease; }
    .hint.visible { opacity: 1; }
    .toast { position: absolute; left: 50%; top: 22%; transform: translate(-50%, 8px); color: #fff3c8; font: 600 14px 'DM Sans', sans-serif; text-shadow: 0 2px 9px #132218, 0 1px 3px #132218; opacity: 0; transition: opacity .2s, transform .2s; text-align: center; width: min(90vw, 460px); }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    .controls-note { position: absolute; left: max(26px, env(safe-area-inset-left)); bottom: max(24px, env(safe-area-inset-bottom)); color: rgba(237, 242, 215, .76); font: 10px 'DM Mono', monospace; letter-spacing: .04em; }
    .controls-note kbd { padding: 3px 5px; border: 1px solid rgba(237, 242, 215, .28); border-radius: 3px; color: var(--ink); font: inherit; }
    .touch-controls { display: none; position: absolute; inset: auto 0 max(22px, env(safe-area-inset-bottom)); align-items: end; justify-content: space-between; padding: 0 22px; pointer-events: auto; }
    .dpad { display: grid; grid-template: repeat(3, 48px) / repeat(3, 48px); gap: 4px; }
    .touch-btn { display: grid; place-items: center; width: 48px; height: 48px; border: 1px solid rgba(238, 243, 216, .35); border-radius: 8px; background: rgba(24, 42, 30, .68); color: var(--ink); font: 20px 'DM Sans', sans-serif; touch-action: none; backdrop-filter: blur(5px); }
    .touch-btn:active, .touch-btn.pressed { background: rgba(148, 181, 111, .55); }
    .dpad [data-dir="up"] { grid-area: 1 / 2; } .dpad [data-dir="left"] { grid-area: 2 / 1; }
    .dpad [data-dir="right"] { grid-area: 2 / 3; } .dpad [data-dir="down"] { grid-area: 3 / 2; }
    .action-buttons { display: flex; align-items: end; gap: 10px; }
    .action-buttons .touch-btn { width: 54px; height: 54px; border-radius: 50%; font-size: 12px; font-weight: 700; }
    .action-buttons [data-action="attack"] { width: 62px; height: 62px; color: #ffe6a1; }
    .credits { position: absolute; right: max(26px, env(safe-area-inset-right)); bottom: max(25px, env(safe-area-inset-bottom)); color: rgba(237, 242, 215, .48); font: 9px 'DM Mono', monospace; letter-spacing: .12em; text-transform: uppercase; }
    .ending { position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; padding: 24px; background: rgba(14, 27, 18, .66); opacity: 0; pointer-events: none; transition: opacity .5s; }
    .ending.visible { opacity: 1; pointer-events: auto; }

    .ending-mark { margin-bottom: 14px; color: var(--gold); font-size: 30px; }

    .ending button { padding: 11px 18px; border: 1px solid rgba(243, 207, 117, .7); border-radius: 4px; background: rgba(243, 207, 117, .1); color: #f5efd7; font: 600 12px 'DM Mono', monospace; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (pointer: coarse), (max-width: 760px) {
      .touch-controls { display: flex; }
      .controls-note, .credits { display: none; }
      .brand { top: max(16px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); gap: 8px; }
      .brand-mark { width: 30px; height: 30px; }
      .brand-name { font-size: 14px; }
      .brand-sub { font-size: 8px; }
      .quest { top: max(16px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); width: min(208px, 52vw); padding: 10px 11px; }
      .quest-text { font-size: 11px; margin-top: 5px; }
      .quest-label { font-size: 9px; }
      .health { top: 76px; right: max(15px, env(safe-area-inset-right)); }
      .heart { width: 15px; height: 15px; }
      .hint { bottom: max(155px, calc(env(safe-area-inset-bottom) + 145px)); font-size: 12px; max-width: 88vw; white-space: normal; text-align: center; }
      .toast { top: 19%; font-size: 13px; }
      .touch-controls { padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
      .dpad { grid-template: repeat(3, 43px) / repeat(3, 43px); }
      .touch-btn { width: 43px; height: 43px; }
      .action-buttons .touch-btn { width: 49px; height: 49px; }
      .action-buttons [data-action="attack"] { width: 57px; height: 57px; }
    }
    @media (max-height: 430px) and (pointer: coarse) {
      .touch-controls { bottom: max(8px, env(safe-area-inset-bottom)); }
      .dpad { grid-template: repeat(3, 36px) / repeat(3, 36px); }
      .touch-btn { width: 36px; height: 36px; }
      .action-buttons .touch-btn { width: 42px; height: 42px; }
      .action-buttons [data-action="attack"] { width: 48px; height: 48px; }
      .hint { bottom: max(112px, calc(env(safe-area-inset-bottom) + 104px)); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Faedra exploring the forest of Hartshollow"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="hud">
    <div class="brand"><div class="brand-mark">F</div><div><div class="brand-name">Faedra</div><div class="brand-sub">Hartshollow</div></div></div>

      <div class="quest-label"><span id="area-label">Forest of Hartshollow</span><span class="seeds" id="seed-count">0 / 3 ✦</span></div>
      <div class="quest-text" id="quest-text">Find the three lost lights</div>

    <div class="health" id="health" aria-label="Three hearts"></div>
    <div class="hint" id="hint"></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="controls-note"><kbd>WASD</kbd> move &nbsp; <kbd>SPACE</kbd> jump &nbsp; <kbd>J</kbd> strike &nbsp; <kbd>E</kbd> interact</div>
    <div class="touch-controls" aria-label="Touch controls">
      <div class="dpad">
        <button class="touch-btn" data-dir="up" aria-label="Move up">▲</button>
        <button class="touch-btn" data-dir="left" aria-label="Move left">◀</button>
        <button class="touch-btn" data-dir="right" aria-label="Move right">▶</button>
        <button class="touch-btn" data-dir="down" aria-label="Move down">▼</button>
      </div>
      <div class="action-buttons">
        <button class="touch-btn" data-action="interact" aria-label="Interact">USE</button>
        <button class="touch-btn" data-action="jump" aria-label="Jump">JUMP</button>
        <button class="touch-btn" data-action="attack" aria-label="Attack">✦</button>
      </div>
    </div>
    <div class="credits">A little light goes a long way</div>
  </div>
  <div class="ending" id="ending">
    <div class="ending-panel">
      <div class="ending-mark">✦</div>
      <h1>The forest remembers.</h1>
      <p>One by one, the old lights return to Hartshollow. Beneath the leaves, the roots begin to sing again.</p>
      <button id="again">Wander once more</button>
    </div>
  </div>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const seedLabel = document.getElementById('seed-count');
  const questLabel = document.getElementById('quest-text');
  const areaLabel = document.getElementById('area-label');
  const healthLabel = document.getElementById('health');
  const hint = document.getElementById('hint');
  const toast = document.getElementById('toast');
  const ending = document.getElementById('ending');
  const TAU = Math.PI * 2;
  const world = { width: 3300, height: 1500 };
  const shrineWorld = { width: 700, height: 800 };
  const buildingWorld = { width: 700, height: 600 };
  const meadowWorld = { width: world.width, height: world.height };
  const keys = new Set();
  const touch = { x: 0, y: 0, actions: new Set() };
  let width = innerWidth;
  let height = innerHeight;
  let scale = 1;
  let lastTime = 0;
  let toastTimer = 0;
  let elapsed = 0;
  let gameWon = false;
  let scene = 'forest';
  let shrineAwakened = false;
  let forestReturn = null;
  let currentBuilding = null;
  let buildingReturn = null;
  let meadowReturn = null;
  let meadowDelivered = false;
  let camera = { x: 0, y: 0 };
  let randomSeed = 8457;

  function random() {
    randomSeed = (randomSeed * 1664525 + 1013904223) >>> 0;
    return randomSeed / 4294967296;
  }
  function resize() {
    width = innerWidth;
    height = innerHeight;
    scale = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * scale);
    canvas.height = Math.round(height * scale);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  const player = { x: 272, y: 738, faceX: 1, faceY: 0, speed: 218, health: 3, jump: 0, jumpTime: 0, attack: 0, attackCooldown: 0, invulnerable: 0, moving: false, collected: 0 };
  const lights = [
    { x: 510, y: 425, name: 'the fern light', taken: false },
    { x: 1084, y: 1040, name: 'the river light', taken: false },

  ];
  const meadowBlooms = [

    { x: 1450, y: 1120, name: 'a blue starflower', taken: false, color: '#9dc8dc' },
    { x: 2280, y: 360, name: 'a roseheart bloom', taken: false, color: '#e8a4a0' }
  ];
  const meadowGatheringPlace = { x: 2820, y: 740 };
  const meadowExit = { x: 75, y: 740 };

  const shrineDoor = { x: 350, y: 700 };
  const shrineInscriptions = [

    { x: 350, y: 490, text: 'A final line reads: “The heartwood wakes when wanderers return.”' }
  ];
    const riverCrossing = { y: 740, halfHeight: 42 };
  const signposts = [
    { x: 355, y: 706, text: 'A weatherworn sign reads: “When the fireflies fade, follow the old roots east.”' },
    { x: 924, y: 603, text: 'The stream murmurs under the moss. Something bright glimmers downstream.' },

  const forestFolk = [
    { x: 1672, y: 744, name: 'Elowen', robe: '#7d8c59', hair: '#493b32', spoken: false, text: 'You brought the three lights home. Listen, Faedra. Hartshollow is breathing again.' },

  const villageBuildings = [

    { x: 2760, y: 520, w: 154, h: 126, roof: '#717449', name: 'The Greenhouse', kind: 'greenhouse' },
    { x: 3040, y: 585, w: 142, h: 116, roof: '#8a6346', name: 'The Woodwright', kind: 'workshop' },
    { x: 2780, y: 955, w: 184, h: 140, roof: '#625f48', name: 'Village Hall', kind: 'hall' }
  ];
  const buildingInteriors = {
    inn: {
      resident: { x: 490, y: 285, name: 'Sella', robe: '#a66f52', hair: '#50372d', spoken: false, text: 'Sella wipes down the counter. “A room upstairs is yours whenever you need a rest, Faedra.”' },
      props: [
        { x: 350, y: 183, w: 210, h: 42, kind: 'counter', name: 'The counter', text: 'Copper mugs and jars of blackberry cordial line the counter.' },
        { x: 220, y: 330, w: 78, h: 52, kind: 'table', name: 'A table', text: 'Carved initials cover the old table. One is shaped like a tiny leaf.' },
        { x: 385, y: 385, w: 84, h: 54, kind: 'table', name: 'A table', text: 'A half-finished story is written on a scrap of paper.' }
      ]
    },
    greenhouse: {
      resident: { x: 350, y: 340, name: 'Tavin', robe: '#63845e', hair: '#b59a68', spoken: false, text: 'Tavin smiles over the seedlings. “The old lights have reached even the roots beneath this floor.”' },
      props: [
        { x: 210, y: 230, w: 100, h: 48, kind: 'planter', name: 'A planter', text: 'Tiny silverleaf shoots uncurl toward the warm stone.' },
        { x: 490, y: 230, w: 100, h: 48, kind: 'planter', name: 'A planter', text: 'A cluster of blue flowers trembles in a breeze from nowhere.' },
        { x: 210, y: 390, w: 100, h: 48, kind: 'planter', name: 'A planter', text: 'Soft moss grows in a perfect ring around a single seed.' },
        { x: 490, y: 390, w: 100, h: 48, kind: 'planter', name: 'A planter', text: 'The herbs smell sharp and sweet beneath the glass roof.' }

    },

      props: [

        { x: 220, y: 350, w: 92, h: 46, kind: 'wood', name: 'Stacked timber', text: 'Carefully sorted ash and alder, ready for the next repair.' },

    },

      props: [
        { x: 350, y: 230, w: 220, h: 56, kind: 'table', name: 'The council table', text: 'A map marks the river, the shrine, and a meadow beyond the village.' },

      ]
    }
  };
  const villageFolk = [
    { x: 2540, y: 748, name: 'Miri', robe: '#b67a58', hair: '#533a2e', spoken: false, text: 'Welcome to Hartshollow. The Bramble Cup is warm again, now the shrine lights have returned.' },
    { x: 2960, y: 748, name: 'Orrin', robe: '#667f69', hair: '#b9a26e', spoken: false, text: 'I heard the old stones sing. Take the eastern lane past the hall; the woods open into a lovely meadow.' }
  ];
  const trees = [];
  const lightTrail = { startX: player.x, startY: player.y, dx: lights[0].x - player.x, dy: lights[0].y - player.y };
  for (let i = 0; i < 180; i++) {
    const x = 70 + random() * (world.width - 140);
    const y = 55 + random() * (world.height - 110);
    const nearPath = Math.abs(y - (750 + Math.sin(x / 190) * 90)) < 100 || Math.abs(x - (700 + Math.sin(y / 180) * 110)) < 90 || Math.abs(x - 1700) < 105 && Math.abs(y - 750) < 150;

    const nearVillageFolk = villageFolk.some(person => Math.hypot(x - person.x, y - person.y) < 62);
    const trailPosition = Math.max(0, Math.min(1, ((x - lightTrail.startX) * lightTrail.dx + (y - lightTrail.startY) * lightTrail.dy) / (lightTrail.dx ** 2 + lightTrail.dy ** 2)));
    const nearLightTrail = Math.hypot(x - lightTrail.startX - lightTrail.dx * trailPosition, y - lightTrail.startY - lightTrail.dy * trailPosition) < 48;
    if (!nearPath && !nearLight && !nearForestFolk && !nearVillage && !nearVillageFolk && !nearLightTrail && Math.hypot(x - player.x, y - player.y) > 140) {
      trees.push({ x, y, r: 24 + random() * 27, hue: random(), sway: random() * TAU });

  }
  const stones = [];
  for (let i = 0; i < 94; i++) {

    { x: 1665, y: 536, homeX: 1665, homeY: 536, phase: 1.2, health: 2, alive: true, hit: 0 }
  ];

  function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
  }
  function drawGround() {
    ctx.fillStyle = '#527847';
    ctx.fillRect(0, 0, world.width, world.height);
    const gradient = ctx.createLinearGradient(0, 0, world.width, world.height);
    gradient.addColorStop(0, 'rgba(170, 190, 105, .09)');
    gradient.addColorStop(.58, 'rgba(19, 51, 35, .02)');
    gradient.addColorStop(1, 'rgba(24, 45, 28, .18)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, world.width, world.height);
    for (let i = 0; i < 1400; i++) {
      const x = (i * 197 + (i % 13) * 29) % world.width;
      const y = (i * 113 + (i % 17) * 47) % world.height;
      ctx.fillStyle = i % 3 === 0 ? 'rgba(202, 205, 132, .12)' : 'rgba(27, 57, 34, .12)';
      ctx.fillRect(x, y, 2 + i % 3, 1 + i % 2);
    }
    ctx.beginPath();
    ctx.moveTo(-60, 810);
    ctx.bezierCurveTo(330, 570, 512, 858, 870, 708);
    ctx.bezierCurveTo(1100, 616, 1195, 800, 1480, 706);
    ctx.bezierCurveTo(1665, 645, 1815, 785, 2290, 647);
    ctx.lineTo(2290, 822);
    ctx.bezierCurveTo(1850, 957, 1660, 790, 1480, 852);
    ctx.bezierCurveTo(1170, 956, 1075, 775, 888, 840);
    ctx.bezierCurveTo(550, 965, 352, 710, -60, 940);
    ctx.closePath();
    ctx.fillStyle = '#a69a6c';
    ctx.fill();
    ctx.strokeStyle = 'rgba(226, 205, 145, .24)';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(330, -80);
    ctx.bezierCurveTo(490, 260, 737, 378, 709, 720);
    ctx.bezierCurveTo(693, 970, 934, 1180, 1060, 1570);
    ctx.lineTo(1177, 1570);
    ctx.bezierCurveTo(1050, 1190, 811, 950, 829, 716);
    ctx.bezierCurveTo(853, 371, 605, 223, 465, -80);
    ctx.closePath();
    ctx.fillStyle = 'rgba(157, 145, 101, .8)';
    ctx.fill();

  function updateHud() {
    seedLabel.textContent = scene === 'meadow' ? `${meadowBlooms.filter(bloom => bloom.taken).length} / 3 ${meadowDelivered ? '✓' : '✿'}` : `${player.collected} / 3 ✦`;
    areaLabel.textContent = scene === 'meadow' ? 'The East Meadow' : scene === 'shrine' ? 'The Heartwood Shrine' : scene === 'building' ? currentBuilding.name : 'Forest of Hartshollow';
    questLabel.textContent = scene === 'meadow' ? meadowDelivered ? 'The meadow is in bloom' : meadowBlooms.every(bloom => bloom.taken) ? 'Bring the blooms to the stone circle' : 'Gather three meadow blooms' : scene === 'building' ? `Explore ${currentBuilding.name}` : scene === 'shrine' ? shrineAwakened ? 'Explore the awakened shrine' : 'Explore the ancient shrine' : shrineAwakened ? forestFolk.concat(villageFolk).every(person => person.spoken) ? 'Hartshollow remembers' : 'Speak with the forest folk' : player.collected === 3 ? 'Return to the old shrine' : 'Find the three lost lights';
    healthLabel.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const heart = document.createElement('span');
      heart.className = 'heart' + (i >= player.health ? ' empty' : '');
      heart.innerHTML = '<svg viewBox="0 0 20 18" aria-hidden="true"><path fill="currentColor" d="M10 17S1 11.4 1 5.7C1 .5 7 .1 10 4.2 13 .1 19 .5 19 5.7 19 11.4 10 17 10 17Z"/></svg>';
      heart.firstChild.classList.add('heart-icon');
      heart.firstChild.style.width = '100%';
      heart.firstChild.style.height = '100%';
      heart.setAttribute('aria-hidden', 'true');
      healthLabel.appendChild(heart);
    }
    healthLabel.setAttribute('aria-label', `${player.health} of 3 hearts`);
  }
  function performAttack() {
    if (player.attackCooldown > 0) return;
    player.attack = .24;
    player.attackCooldown = .42;
    for (const enemy of enemies) {
      if (!enemy.alive) continue;
      const dx = enemy.x - player.x, dy = enemy.y - player.y;
      const d = Math.hypot(dx, dy);
      const facing = (dx * player.faceX + dy * player.faceY) / (d || 1);
      if (d < 69 && facing > .05) {
        enemy.health--;
        enemy.hit = .2;
        if (enemy.health <= 0) { enemy.alive = false; say('The lost wisp drifts back into the leaves.'); }
      }
    }
  }
  function performInteract() {
    const target = interactable();
    if (!target) return;
    if (scene === 'meadow') {
      if (target.type === 'meadowExit') {
        scene = 'forest';
        player.x = meadowReturn.x;
        player.y = meadowReturn.y;
        player.faceX = -1;
        player.faceY = 0;
        meadowReturn = null;
        updateHud();
        say('You return to the village lane.');
      } else if (target.type === 'meadowGatheringPlace') {
        if (meadowDelivered) say('The stone circle glows softly among the meadow flowers.');
        else if (!meadowBlooms.every(bloom => bloom.taken)) say('The stone circle is waiting. Gather all three meadow blooms first.');
        else {
          meadowDelivered = true;
          updateHud();
          say('You lay the three blooms in the stone circle. The meadow answers with a wash of light.');
        }
      }
      return;
    }
    if (scene === 'building') {
      if (target.type === 'buildingExit') {
        scene = 'forest';
        player.x = buildingReturn.x;
        player.y = buildingReturn.y;
        player.faceX = 0;
        player.faceY = 1;
        currentBuilding = null;
        buildingReturn = null;
        updateHud();
        say('You step back out onto the village lane.');
      } else if (target.type === 'resident') {
        target.item.spoken = true;
        say(target.item.text);
      } else if (target.type === 'interiorProp') say(target.item.text);
      return;
    }
    if (scene === 'shrine') {
      if (target.type === 'inscription') { say(target.item.text); return; }
      if (target.type === 'exit') {
        scene = 'forest';
        player.x = forestReturn.x;
        player.y = forestReturn.y;
        player.faceX = 0;
        player.faceY = 1;
        forestReturn = null;
        updateHud();
        say('You step back into the forest clearing.');
        return;
      }
      if (target.type === 'altar') {
        if (!shrineAwakened) {
          shrineAwakened = true;
          updateHud();
          say('The three lights settle into the altar. The old shrine stirs awake.');
        } else say('Warm light hums through the ancient stone.');
      }
      return;
    }
    if (target.type === 'sign') { say(target.item.text); return; }
    if (target.type === 'person') {
      target.item.spoken = true;
      say(target.item.text);
      updateHud();
      return;
    }
    if (target.type === 'buildingDoor') {
      currentBuilding = target.item;
      buildingReturn = { x: player.x, y: player.y };
      scene = 'building';
      player.x = 350;
      player.y = 500;
      player.faceX = 0;
      player.faceY = -1;
      player.jumpTime = 0;
      updateHud();
      say(`You step inside ${currentBuilding.name}.`);
      return;
    }
    if (target.type === 'meadowGate') {
      meadowReturn = { x: player.x, y: player.y };
      scene = 'meadow';
      player.x = 155;
      player.y = meadowExit.y;
      player.faceX = 1;
      player.faceY = 0;
      player.jumpTime = 0;
      updateHud();
      say('Beyond the village, wildflowers sway in the East Meadow.');
      return;
    }
    if (player.collected < 3) { say('The heartwood is quiet. Find all three lost lights first.'); return; }
    forestReturn = { x: player.x, y: player.y };
    scene = 'shrine';
    player.x = 350;
    player.y = 610;
    player.faceX = 0;
    player.faceY = -1;
    player.jumpTime = 0;
    updateHud();
    say('The hidden doorway opens. Explore the old shrine.');
  }
  function jump() {
    if (player.jumpTime <= 0) player.jumpTime = .62;
  }
  function damage() {
    if (player.invulnerable > 0) return;
    player.health--;
    player.invulnerable = 1.15;
    if (player.health <= 0) {
      player.health = 3;
      if (scene === 'shrine') {
        player.x = 350;
        player.y = 610;
      } else {
        player.x = 272;
        player.y = 738;
      }
      say('The forest gently returns you to the old path.');
    } else say('A wisp brushes past. Keep your distance or strike back.');
    updateHud();
  }
  function update(dt) {
    elapsed += dt;
    if (toastTimer > 0 && (toastTimer -= dt) <= 0) toast.classList.remove('visible');
    player.attack = Math.max(0, player.attack - dt);
    player.attackCooldown = Math.max(0, player.attackCooldown - dt);
    player.invulnerable = Math.max(0, player.invulnerable - dt);
    if (player.jumpTime > 0) {
      player.jumpTime = Math.max(0, player.jumpTime - dt);
      const t = 1 - player.jumpTime / .62;
      player.jump = Math.sin(t * Math.PI) * 53;
    } else player.jump = 0;

    let dx = (keys.has('ArrowRight') || keys.has('d') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('a') ? 1 : 0) + touch.x;
    let dy = (keys.has('ArrowDown') || keys.has('s') ? 1 : 0) - (keys.has('ArrowUp') || keys.has('w') ? 1 : 0) + touch.y;
    const magnitude = Math.hypot(dx, dy);
    player.moving = magnitude > .08;
    if (magnitude > 1) { dx /= magnitude; dy /= magnitude; }
    if (player.moving) {
      const speed = player.speed * dt;
      const nx = player.x + dx * speed;
      const ny = player.y + dy * speed;
      if (!blocked(nx, player.y)) player.x = nx;
      if (!blocked(player.x, ny)) player.y = ny;
      player.faceX = dx; player.faceY = dy;
    }
    if (scene === 'forest') {
      for (const light of lights) {
        if (!light.taken && distance(player, light) < 30) {
          light.taken = true;
          player.collected++;
          say(`You found ${light.name}. A warm little light settles in your pocket.`);
          updateHud();
        }
      }
      for (const enemy of enemies) {
        if (!enemy.alive) continue;
        enemy.hit = Math.max(0, enemy.hit - dt);
        enemy.phase += dt;
        const targetX = enemy.homeX + Math.sin(enemy.phase * .55) * 30;
        const targetY = enemy.homeY + Math.cos(enemy.phase * .7) * 24;
        enemy.x += (targetX - enemy.x) * dt * .7;
        enemy.y += (targetY - enemy.y) * dt * .7;
        if (distance(player, enemy) < 24 && player.jump < 10) damage();
      }
    }
    if (scene === 'meadow') {
      for (const bloom of meadowBlooms) {
        if (!bloom.taken && distance(player, bloom) < 30) {
          bloom.taken = true;
          say(`You gather ${bloom.name}. Carry it to the stone circle.`);
          updateHud();
        }
      }
    }
    const target = interactable();
    if (target) {
      const hints = {
        sign: 'E  Read the sign',
        shrine: player.collected === 3 ? 'E  Enter the ancient shrine' : 'The old shrine is waiting for three lights',
        meadowGate: 'E  Follow the eastern lane to the meadow',
        meadowExit: 'E  Return to the village',
        meadowGatheringPlace: meadowDelivered ? 'The meadow is in bloom' : meadowBlooms.every(bloom => bloom.taken) ? 'E  Place the blooms in the stone circle' : 'The stone circle is waiting for three blooms',
        altar: shrineAwakened ? 'E  Listen to the heartwood' : 'E  Set the lights into the altar',
        inscription: 'E  Read the inscription',
        exit: 'E  Return to the forest'
      };
      hint.textContent = target.type === 'person' || target.type === 'resident' ? `E  Talk to ${target.item.name}` : target.type === 'buildingDoor' ? `E  Enter ${target.item.name}` : target.type === 'interiorProp' ? `E  Inspect ${target.item.name}` : hints[target.type];
      hint.classList.add('visible');
    } else hint.classList.remove('visible');

    const activeWorld = scene === 'meadow' ? meadowWorld : scene === 'shrine' ? shrineWorld : scene === 'building' ? buildingWorld : world;
    const viewW = width, viewH = height;
    camera.x = activeWorld.width < viewW ? (activeWorld.width - viewW) / 2 : Math.max(0, Math.min(activeWorld.width - viewW, player.x - viewW / 2));
    camera.y = activeWorld.height < viewH ? (activeWorld.height - viewH) / 2 : Math.max(0, Math.min(activeWorld.height - viewH, player.y - viewH / 2));
  }
  function render() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, width, height);
    ctx.save();
    ctx.translate(-camera.x, -camera.y);
    if (scene === 'building') {
      drawBuildingInterior();
      drawForestPerson(buildingInteriors[currentBuilding.kind].resident);
      drawPlayer();
    } else if (scene === 'meadow') {
      drawMeadowGround();
      for (const bloom of meadowBlooms) drawMeadowBloom(bloom);
      drawPlayer();
    } else if (scene === 'shrine') {
      drawShrineInterior();
      drawPlayer();
    } else {
      drawGround();
      for (const stone of stones) drawStone(stone);
      for (const sign of signposts) drawSign(sign);
      for (const light of lights) drawLight(light);
      const actors = trees.map(tree => ({ y: tree.y, draw: () => drawTree(tree) }));
      if (shrineAwakened) for (const person of forestFolk) actors.push({ y: person.y, draw: () => drawForestPerson(person) });
      for (const person of villageFolk) actors.push({ y: person.y, draw: () => drawForestPerson(person) });
      actors.push({ y: player.y, draw: drawPlayer });
      for (const enemy of enemies) if (enemy.alive) actors.push({ y: enemy.y, draw: () => drawEnemy(enemy) });
      actors.sort((a, b) => a.y - b.y);
      for (const actor of actors) actor.draw();
    }
    ctx.restore();
  }
  function frame(time) {
    const dt = Math.min((time - lastTime) / 1000 || 0, .04);
    lastTime = time;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  function keyDown(event) {
    const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();
    keys.add(key);
    if (!event.repeat) {
      if (key === 'j' || key === 'J') performAttack();
      if (key === 'e' || key === 'E' || key === 'Enter') performInteract();
      if (key === ' ' || key === 'Spacebar') jump();
    }
  }
  function keyUp(event) {
    keys.delete(event.key.length === 1 ? event.key.toLowerCase() : event.key);
  }
  addEventListener('keydown', keyDown);
  addEventListener('keyup', keyUp);
  addEventListener('blur', () => keys.clear());
  document.querySelectorAll('[data-dir]').forEach(button => {
    const dir = button.dataset.dir;
    const vectors = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    const start = event => {
      event.preventDefault(); button.setPointerCapture(event.pointerId); button.classList.add('pressed');
      touch.x = vectors[dir][0]; touch.y = vectors[dir][1];
    };
    const stop = event => { if (event) event.preventDefault(); button.classList.remove('pressed'); touch.x = 0; touch.y = 0; };
    button.addEventListener('pointerdown', start);
    button.addEventListener('pointerup', stop);
    button.addEventListener('pointercancel', stop);
    button.addEventListener('lostpointercapture', stop);
  });
  document.querySelectorAll('[data-action]').forEach(button => {
    const action = button.dataset.action;
    const start = event => {
      event.preventDefault(); button.setPointerCapture(event.pointerId); button.classList.add('pressed');
      if (action === 'attack') performAttack();
      else if (action === 'jump') jump();
      else if (action === 'interact') performInteract();
    };
    const stop = () => button.classList.remove('pressed');
    button.addEventListener('pointerdown', start);
    button.addEventListener('pointerup', stop);
    button.addEventListener('pointercancel', stop);
    button.addEventListener('lostpointercapture', stop);
  });
  updateHud();
  say('The forest has gone quiet. Find the three lights and follow the old path.');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
