  }
  function keyUp(event) {
    keys.delete(event.key.length === 1 ? event.key.toLowerCase() : event.key);
  }
  addEventListener('keydown', keyDown);
  addEventListener('keyup', keyUp);
  addEventListener('blur', () => keys.clear());
  document.querySelectorAll('[data-dir]').forEach(button => {
    const dir = button.dataset.dir;
    const vectors = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    const start = event => {
      event.preventDefault(); button.setPointerCapture(event.pointerId); button.classList.add('pressed');
      touch.x = vectors[dir][0]; touch.y = vectors[dir][1];
    };
    const stop = event => { if (event) event.preventDefault(); button.classList.remove('pressed'); touch.x = 0; touch.y = 0; };
    button.addEventListener('pointerdown', start);
    button.addEventListener('pointerup', stop);
    button.addEventListener('pointercancel', stop);
    button.addEventListener('lostpointercapture', stop);
  });
  document.querySelectorAll('[data-action]').forEach(button => {
    const action = button.dataset.action;
    const start = event => {
      event.preventDefault(); button.setPointerCapture(event.pointerId); button.classList.add('pressed');
      if (action === 'attack') performAttack();
      else if (action === 'jump') jump();
      else if (action === 'interact') performInteract();
    };
    const stop = () => button.classList.remove('pressed');
    button.addEventListener('pointerdown', start);
    button.addEventListener('pointerup', stop);
    button.addEventListener('pointercancel', stop);
    button.addEventListener('lostpointercapture', stop);
  });
  updateHud();
  say('The forest has gone quiet. Find the three lights and follow the old path.');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
